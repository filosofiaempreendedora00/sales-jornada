<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Polvinho minimalista. 5 tentáculos em forma de banana —
       cada um curva CONSISTENTEMENTE em uma direção (não zigzag),
       fica na sua coluna sem cruzar com os vizinhos. Tips em fan:
       T1 aponta pra (4,58), T5 pra (60,58), tips no meio descem mais
       baixo (T3 em 32,63). Cria movimento orgânico tipo polvo
       espalhando os braços, sem rigidez de aranha/caranguejo. -->

  <g fill="#ffffff">
    <!-- T1: banana curvando forte pra esquerda -->
    <path d="M 8 30
             C 2 38, 0 50, 4 58
             C 8 52, 14 40, 16 30 Z"/>

    <!-- T2: banana suave pra esquerda -->
    <path d="M 18 32
             C 14 42, 12 54, 14 62
             C 20 54, 24 42, 26 32 Z"/>

    <!-- T3: centro, quase reto com leve curva -->
    <path d="M 28 32
             C 28 44, 30 56, 32 63
             C 34 56, 36 44, 36 32 Z"/>

    <!-- T4: banana suave pra direita (espelho T2) -->
    <path d="M 38 32
             C 40 42, 44 54, 50 62
             C 52 54, 50 42, 46 32 Z"/>

    <!-- T5: banana curvando forte pra direita (espelho T1) -->
    <path d="M 48 30
             C 50 40, 56 52, 60 58
             C 64 50, 62 38, 56 30 Z"/>
  </g>

  <!-- Cabeça por cima -->
  <ellipse cx="32" cy="20" rx="24" ry="14" fill="#ffffff"/>

  <!-- Olhinhos -->
  <circle cx="23" cy="20" r="3" fill="#0a0a16"/>
  <circle cx="41" cy="20" r="3" fill="#0a0a16"/>
</svg>
